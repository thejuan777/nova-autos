<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ingresar | NOVA AUTOS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script type="module" src="login.js"></script></head>
<body class="login-page">
<header class="header"><a href="index.html" class="logo">NOVA <span>AUTOS</span></a><a class="header-link" href="index.html">Volver al sitio</a></header>
<main class="login-card">
<p class="section-label">ACCESO PRIVADO</p><h1>Administrá tu agencia.</h1><p>Ingresá con tu cuenta de administrador.</p>
<p id="login-message" class="notice" role="status" aria-live="polite" hidden></p>
<form id="login-form">
<label>Email<input type="email" name="email" autocomplete="username" required maxlength="254"></label>
<label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
<button class="action primary" type="submit">Iniciar sesión</button>
</form><p class="help">Las cuentas son habilitadas por la administración de NOVA AUTOS.</p>
<noscript>Activá JavaScript para iniciar sesión.</noscript>
</main></body></html>
